<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ten-Go! - Route Weather Forecast</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- SEO & SNS Meta Tags -->
    <meta name="description" content="目的地までの道中の天気を確認">
    <meta property="og:title" content="Ten-Go!">
    <meta property="og:description" content="目的地までの道中の天気を確認">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ten-Go!">
    <meta name="twitter:description" content="目的地までの道中の天気を確認">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar / Panel -->
        <div class="glass-panel" id="controls">
            <div id="resize-handle"></div>
            
            <div id="controls-scroll-area">
                <header>
                    <div class="header-main">
                        <h1>Ten-Go!</h1>
                        <p>目的地までの道中の天気を確認</p>
                    </div>
                    <div class="header-hint" id="header-hint">
                        💡 経路クリックで地点追加
                    </div>
                </header>

                <div class="settings-panel">
                    <p class="settings-title">📝 検索設定</p>
                    
                    <div class="input-row">
                        <div class="input-group">
                            <label for="date-select">出発予定日</label>
                            <select id="date-select"></select>
                        </div>
                        <div class="input-group">
                            <label for="time-select">出発時刻</label>
                            <select id="time-select"></select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="mode-select">移動手段</label>
                        <select id="mode-select">
                            <option value="driving">🚗 車</option>
                            <option value="cycling">🚲 自転車</option>
                            <option value="walking">🚶 徒歩</option>
                        </select>
                    </div>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-tab="search-tab">地点検索</button>
                    <button class="tab-btn" data-tab="upload-tab">ファイル / 共有URL</button>
                </div>

                <div id="search-tab" class="tab-content active">
                    <form id="route-form">
                        <div class="input-group">
                            <label for="start-input">出発地 (Start)</label>
                            <div class="input-with-button">
                                <input type="text" id="start-input" placeholder="例: 東京駅" required>
                                <button type="button" id="current-loc-btn" title="現在地を取得">📍</button>
                            </div>
                        </div>

                        <div id="via-points-container">
                            <!-- 動的に経由地フォームが追加されます -->
                        </div>
                        
                        <button type="button" id="add-via-btn" class="sm-btn">＋ 経由地を追加</button>
                        
                        <div class="input-group">
                            <label for="end-input">目的地 (Destination)</label>
                            <input type="text" id="end-input" placeholder="例: 箱根" required>
                        </div>

                        <div class="button-group">
                            <button type="submit" id="search-btn">経路と天気を検索</button>
                        </div>
                    </form>
                </div>

                <div id="upload-tab" class="tab-content">
                    <form id="upload-form">
                        <div class="input-group">
                            <label for="url-input">Google Maps 共有URL</label>
                            <input type="url" id="url-input" placeholder="https://www.google.com/maps/dir/..." autocomplete="off">
                            <p class="help-text">
                                <strong>【推奨】</strong> ブラウザのアドレスバーにある長いURLをコピーして貼り付けてください。<br>
                                ※「短い共有リンク」は解析できない場合があります。
                            </p>
                        </div>

                        <div class="divider">または</div>

                        <div class="input-group">
                            <label for="file-input">KML / GeoJSON アップロード</label>
                            <input type="file" id="file-input" accept=".kml,.geojson,.json">
                        </div>

                        <div class="button-group">
                            <button type="submit" id="upload-btn">読み込みと天気を検索</button>
                        </div>
                    </form>
                </div>
                
                <div id="error-message" class="hidden"></div>
                
                <div class="route-info" id="route-info">
                    <h3>経路サマリー</h3>
                    <p id="distance-text">距離: ---</p>
                    <p id="duration-text">所要時間: ---</p>
                    <p class="hint-text" id="panel-hint">
                        💡 地図上の<strong>ルート（青い線）をクリック</strong>すると、その地点の天気を追加できます。
                    </p>
                </div>
                
                <div class="weather-list" id="weather-list">
                    <!-- Weather cards will be inserted here dynamically -->
                </div>
                <div id="mobile-resize-handle"></div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-spinner-container" class="hidden">
        <div id="loading-spinner" class="spinner"></div>
        <span class="loading-text">計算中...</span>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Application Scripts -->
    <script src="RoutingProvider.js"></script>
    <script src="FileRoutingProvider.js"></script>
    <script src="UrlRoutingProvider.js"></script>
    <script src="WeatherService.js"></script>
    <script src="MapManager.js"></script>
    <script src="app.js"></script></body>
</html>
